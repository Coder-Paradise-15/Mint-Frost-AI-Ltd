<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latency Chart Sandbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Fira+Code:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100vw;
      height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    #plot {
      width: 100%;
      height: 100%;
    }
    
    /* Default cursor for plot and dragging elements - prevents crosshair completely */
    #plot,
    #plot svg,
    #plot .main-svg,
    #plot .draglayer,
    #plot .drag,
    #plot .nsewdrag,
    #plot .cursor-crosshair,
    #plot .hoverlayer,
    #plot .spikeline,
    #plot * {
      cursor: default !important;
    }
    
    /* Pointer cursor for interactive markers */
    #plot .point,
    #plot .scatterpts {
      cursor: pointer !important;
    }
    
    /* Premium Glassmorphic Tooltip */
    #custom-tooltip {
      position: absolute;
      display: none;
      opacity: 0;
      background: rgba(11, 14, 20, 0.88);
      border: 1px solid rgba(0, 212, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 212, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      pointer-events: none;
      z-index: 10000;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      font-size: 11px;
      line-height: 1.4;
      transition: opacity 0.1s ease, transform 0.1s ease;
      transform: translate3d(0,0,0);
    }
  </style>
</head>
<body>
  <div id="plot"></div>
  <div id="custom-tooltip"></div>
  
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script>
    const plotDiv = document.getElementById('plot');
    const tooltip = document.getElementById('custom-tooltip');

    // Chart interaction configurations - completely locks the plot and prevents modifications
    const chartConfig = {
      responsive: true,
      displayModeBar: false,
      doubleClick: false,
      scrollZoom: false,
      editable: false,
      showAxisDragHandles: false,
      showAxisRangeEntryBoxes: false
    };

    // Extract computed styling variables dynamically from the parent window
    function getThemeColors() {
      try {
        const parentDoc = window.parent.document;
        if (parentDoc) {
          const computed = window.getComputedStyle(parentDoc.documentElement);
          const mint = computed.getPropertyValue('--mint').trim();
          const bg0 = computed.getPropertyValue('--bg-0').trim();
          const bg1 = computed.getPropertyValue('--bg-1').trim();
          const fg = computed.getPropertyValue('--fg').trim();
          const muted = computed.getPropertyValue('--muted').trim();
          const border = computed.getPropertyValue('--border').trim();
          const shadow = computed.getPropertyValue('--shadow').trim();
          
          return {
            mint: mint || '#00d4ff',
            bg0: bg0 || '#0b0f14',
            bg1: bg1 || '#0f1620',
            fg: fg || '#e9fbf5',
            muted: muted || '#a6b7b2',
            border: border || 'rgba(255, 255, 255, 0.14)',
            shadow: shadow || '0 10px 30px rgba(0, 0, 0, 0.45)'
          };
        }
      } catch (e) {
        // Fallback if accessed outside of parent environment or in preview mode
      }
      return {
        mint: '#00d4ff',
        bg0: '#0b0f14',
        bg1: '#0f1620',
        fg: '#e9fbf5',
        muted: '#a6b7b2',
        border: 'rgba(255, 255, 255, 0.14)',
        shadow: '0 10px 30px rgba(0, 0, 0, 0.45)'
      };
    }

    // Helper to generate a semi-transparent version of theme colors for filled area gradients
    function getTransparentColor(colorStr, opacity) {
      if (!colorStr) return `rgba(0, 212, 255, ${opacity})`;
      if (colorStr.startsWith('rgb')) {
        return colorStr.replace('rgb', 'rgba').replace(')', `, ${opacity})`);
      }
      if (colorStr.startsWith('#')) {
        const r = parseInt(colorStr.substring(1, 3), 16);
        const g = parseInt(colorStr.substring(3, 5), 16);
        const b = parseInt(colorStr.substring(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      }
      return colorStr;
    }

    function getPlotlyLayout(lineColor, yAxisTitle, maxVal = 0, tickFormat = null) {
      const colors = getThemeColors();
      const xaxis = {
        type: 'date',
        gridcolor: colors.border,
        zeroline: false,
        tickfont: { color: colors.muted, size: 10, family: "'Fira Code', monospace" },
        linecolor: colors.border,
        showspikes: false,
        spikethickness: 0,
        fixedrange: true // Strictly disables dragging and zooming on x-axis
      };
      if (tickFormat) {
        xaxis.tickformat = tickFormat;
      }
      return {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        dragmode: false, // Prevents selection dragging
        font: {
          family: "'Outfit', 'Inter', sans-serif",
          color: colors.fg,
          size: 11
        },
        margin: { t: 20, r: 25, b: 35, l: 50 },
        hovermode: 'closest',
        xaxis: xaxis,
        yaxis: {
          gridcolor: colors.border,
          zeroline: false,
          tickfont: { color: colors.muted, size: 10, family: "'Fira Code', monospace" },
          title: { text: yAxisTitle, font: { size: 10, color: colors.muted, family: "'Outfit', sans-serif" } },
          linecolor: colors.border,
          showspikes: false,
          spikethickness: 0,
          fixedrange: true, // Strictly disables dragging and zooming on y-axis
          tickformat: 'd', // force whole numbers
          range: [0, Math.max(100, Math.ceil(maxVal * 1.15))]
        },
        showlegend: false,
        transition: {
          duration: 800,
          easing: 'cubic-in-out'
        }
      };
    }

    let currentParams = window.location.search.substring(1);

    async function loadChartData(customParams = null) {
      if (customParams !== null) {
        currentParams = customParams;
      }
      try {
        const url = currentParams ? `/api/admin/metrics/latency?${currentParams}&_t=${Date.now()}` : `/api/admin/metrics/latency?_t=${Date.now()}`;
        const latencyRes = await fetch(url);
        if (latencyRes.ok) {
          const latencyData = await latencyRes.json();
          let times = latencyData.map(d => d.time);
          let latencies = latencyData.map(d => d.value);

          const colors = getThemeColors();

          // Apply active dynamic theme variables to the tooltip element itself
          tooltip.style.border = `1px solid ${colors.mint}40`;
          tooltip.style.boxShadow = `0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px ${colors.mint}15`;

          const maxVal = latencies.length > 0 ? Math.max(...latencies) : 0;

          Plotly.react(plotDiv, [{
            x: times,
            y: latencies,
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: colors.mint, width: 2.5, shape: 'spline' },
            marker: { color: colors.mint, size: 8, symbol: 'diamond' },
            fill: 'tozeroy',
            fillcolor: getTransparentColor(colors.mint, 0.08),
            hoverinfo: 'none' // Disable standard SVG tooltip
          }], getPlotlyLayout(colors.mint, 'Latency (ms)', maxVal, '%H:%M'), chartConfig);
        }
      } catch (err) {
        console.error('Failed to load latency chart:', err);
      }
    }

    // Initialize layout
    const colors = getThemeColors();
    Plotly.newPlot(plotDiv, [{
      x: [],
      y: [],
      type: 'scatter',
      mode: 'lines+markers',
      line: { color: colors.mint, width: 2.5, shape: 'spline' },
      marker: { color: colors.mint, size: 8, symbol: 'diamond' },
      fill: 'tozeroy',
      fillcolor: getTransparentColor(colors.mint, 0.08)
    }], getPlotlyLayout(colors.mint, 'Latency (ms)', 0, '%H:%M'), chartConfig);

    loadChartData(window.location.search.substring(1));

    // Live MutationObserver to redraw charts instantly when parent dashboard switches stylesheet themes
    try {
      if (window.parent && window.parent.document) {
        const themeObserver = new MutationObserver(() => {
          loadChartData();
        });
        themeObserver.observe(window.parent.document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme']
        });
      }
    } catch (e) {
      console.warn("[Chart Sandbox] Theme sync observer binding failed:", e);
    }

    // Listen to updates from parent
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'update') {
        loadChartData(event.data.params || '');
      }
    });

    // Run polling every 1 minute continuously
    setInterval(() => {
      loadChartData();
    }, 60000);

    // Custom Tooltip Interaction Handlers
    plotDiv.on('plotly_hover', function(data) {
      const point = data.points[0];
      if (!point || point.x === undefined) return;
      
      const dateVal = new Date(point.x);
      const dateStr = dateVal.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });

      const colors = getThemeColors();
      tooltip.innerHTML = `
        <div style="font-family: 'Outfit', sans-serif; font-weight: 800; color: ${colors.mint}; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; margin-bottom: 8px; font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; display: flex; align-items: center; gap: 6px;">
          <i class="fas fa-bolt" style="color: ${colors.mint};"></i> LATENCY TELEMETRY
        </div>
        <div style="display: flex; justify-content: space-between; gap: 20px; margin-bottom: 4px; font-family: 'Inter', sans-serif; font-size: 11px;">
          <span style="color: ${colors.muted};">Timestamp:</span>
          <span style="font-family: 'Fira Code', monospace; color: ${colors.fg}; font-weight: 600;">${dateStr}</span>
        </div>
        <div style="display: flex; justify-content: space-between; gap: 20px; font-family: 'Inter', sans-serif; font-size: 11px;">
          <span style="color: ${colors.muted};">Avg Latency:</span>
          <span style="font-family: 'Fira Code', monospace; color: ${colors.mint}; font-weight: 700;">${point.y} ms</span>
        </div>
      `;
      tooltip.style.display = 'block';
      tooltip.style.opacity = '1';
    });

    plotDiv.on('plotly_unhover', function() {
      tooltip.style.opacity = '0';
      setTimeout(() => {
        if (tooltip.style.opacity === '0') tooltip.style.display = 'none';
      }, 150);
    });

    // Track mouse coordinate moves smoothly
    plotDiv.addEventListener('mousemove', (e) => {
      if (tooltip.style.display === 'block') {
        const tooltipWidth = tooltip.offsetWidth;
        const tooltipHeight = tooltip.offsetHeight;
        let left = e.clientX + 14;
        let top = e.clientY - 14;
        
        // Prevent boundary overflow
        if (left + tooltipWidth > window.innerWidth) {
          left = e.clientX - tooltipWidth - 14;
        }
        if (top + tooltipHeight > window.innerHeight) {
          top = e.clientY - tooltipHeight - 14;
        }
        
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
      }
    });

    window.addEventListener('resize', () => {
      try {
        Plotly.Plots.resize(plotDiv);
      } catch(e) {}
    });
  </script>
</body>
</html>
